name: gridbook_new

services:
  db:
    # MySQL 8.4 LTS : la branche 8.0 est en fin de vie (avril 2026), sans correctifs de sécurité
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # $$ : interpolé dans le conteneur, le mot de passe n'apparaît pas dans `docker inspect`
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Base joignable depuis la machine hôte uniquement (TablePlus : tunnel SSH vers 127.0.0.1:3308).
    # DB_BIND=0.0.0.0 pour l'ouvrir au réseau, déconseillé.
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_EXPOSED_PORT:-3308}:3306"
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      COOKIE_NAME: ${COOKIE_NAME:-gridbook_new_session}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TEST_USER_EMAIL: ${TEST_USER_EMAIL:-}
      TEST_USER_USERNAME: ${TEST_USER_USERNAME:-joueur}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:-}
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-6}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    # Le navigateur passe par nginx (/api) : le port direct du backend ne sert qu'au débogage
    # sur la machine hôte, et ne doit pas être ouvert au réseau (voir --proxy-headers).
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8001}:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./docker/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/frontend/proxy-api.inc:/etc/nginx/conf.d/proxy-api.inc:ro
    ports:
      - "${FRONTEND_PORT:-5174}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  db_data:
