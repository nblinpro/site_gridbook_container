# Limitation de débit par adresse IP (inclus dans le bloc http de nginx) : l'API entière, et plus
# strictement la connexion et l'inscription. Limites larges, car tous les élèves d'une école ou
# d'une entreprise partagent souvent la même adresse publique ; elles visent les abus, pas l'usage.
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pas de numéro de version nginx dans les réponses et les pages d'erreur
    server_tokens off;
    # Les requêtes de l'API sont de petits JSON : refuser les corps volumineux
    client_max_body_size 64k;

    # --- En-têtes de sécurité (site et API) ---
    # CSP : scripts du site uniquement ; styles inline nécessaires (couleurs dynamiques en
    # attribut style) ; polices Google ; images des API officielles ; appels à Jolpica (F1).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.jolpi.ca; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # HSTS : à activer seulement une fois le site servi en HTTPS (sinon il devient inaccessible en HTTP)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # L'API est servie sous le même port que le site : le navigateur n'a besoin
    # d'atteindre qu'un seul port (utile derrière une redirection de port VS Code / SSH).
    # Connexion, inscription, mot de passe oublié : limite stricte contre le bourrage d'identifiants
    location ~ ^/api/auth/(login|register|forgot-password|reset-password)$ {
        limit_req zone=auth burst=30 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy-api.inc;
    }

    location /api/ {
        limit_req zone=api burst=200 nodelay;
        proxy_pass http://backend:8000/;
        include /etc/nginx/conf.d/proxy-api.inc;
    }

    # Fichiers de build versionnés (nom avec empreinte) : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Jamais de fichiers cachés (.env, .git…) même s'ils se retrouvaient dans le build
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
